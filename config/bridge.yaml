ros_gz_bridge:
  ros__parameters:

    bridges:

      ########### THRUSTER COMMANDS (ROS → GZ) ###########

      - topic_name: "/model/bluerov2/joint/thruster1_joint/cmd_thrust"
        ros_type_name: "std_msgs/msg/Float64"
        gz_type_name: "ignition.msgs.Double"
        direction: "ROS_TO_GZ"

      - topic_name: "/model/bluerov2/joint/thruster1_joint/ang_vel"
        ros_type_name: "std_msgs/msg/Float64"
        gz_type_name: "ignition.msgs.Double"
        direction: "ROS_TO_GZ"

      - topic_name: "/model/bluerov2/joint/thruster1_joint/enable_deadband"
        ros_type_name: "std_msgs/msg/Bool"
        gz_type_name: "ignition.msgs.Boolean"
        direction: "ROS_TO_GZ"


      - topic_name: "/model/bluerov2/joint/thruster2_joint/cmd_thrust"
